name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Configure CMake
        run: |
          cmake --preset x64-release

      - name: Build Filter and Control Panel
        run: |
          cmake --build out/build/x64-release --config Release

      - name: Compile Installer (.iss)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Package Portable ZIP
        run: |
          Compress-Archive -Path out/build/x64-release/KinectInfraredCam.ax, out/build/x64-release/KinectCamControl.exe, out/build/x64-release/Reg.cmd, out/build/x64-release/UnReg.cmd, README.md, LICENSE.txt -DestinationPath out/installer/KinectCam-Portable-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KinectCam-Binaries
          path: |
            out/installer/KinectCam-Setup-x64.exe
            out/installer/KinectCam-Portable-x64.zip

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/installer/KinectCam-Setup-x64.exe
            out/installer/KinectCam-Portable-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
